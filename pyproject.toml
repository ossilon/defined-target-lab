[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "definedtarget"
dynamic = ["version"]
description = "Open tools to price, forward-test and simulate defined-target call ETFs (first fund: XX, S&P 500 10,000 by 2030). Not affiliated with any issuer. Not investment advice."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "numba", "scipy"]   # scipy: the Welch tests of H1 and H9
keywords = ["etf", "options", "leaps", "flex-options", "black-scholes", "implied-volatility", "monte-carlo",
            "forward-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]

# keywords and classifiers belong to [project] above: under this table TOML made them dependency groups, which broke
# `pip install .` (audit of v0.3.0, D20)
[project.optional-dependencies]
flex = ["openpyxl"]    # reading saved Cboe FLEX reports (definedtarget.forward.cboe_flex.extract_fills)

[project.scripts]
definedtarget = "definedtarget.__main__:main"

[tool.setuptools]
packages = ["definedtarget", "definedtarget.forward", "definedtarget.montecarlo"]

[tool.setuptools.package-data]
definedtarget = ["funds/*.json"]

[tool.setuptools.dynamic]
version = { attr = "definedtarget.__version__" }
